plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'waveview.MainWindow' 
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}

tasks.named('test') {
    useJUnit()
}

tasks.named('startScripts') {
    doLast {
        // Appends the export lines directly inside the generated runner file
        unixScript.text = unixScript.text.replace(
            '#!/bin/sh',
            '#!/bin/sh\nexport GDK_SCALE=2\nexport GDK_DPI_SCALE=1.5'
        )
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
}
